name: Bug report
description: A PDF comes out wrong, a share link doesn't load, or the page breaks.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The steps, and which fields you filled in. Please don't paste real names, phone numbers or microchip numbers. Made-up ones that show the problem are perfect.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: For example, Safari on an iPhone 15, or Chrome 131 on Windows 11
    validations:
      required: true
  - type: input
    id: reader
    attributes:
      label: PDF reader, for a problem with a PDF
      placeholder: For example, Preview on macOS, or Adobe Acrobat
